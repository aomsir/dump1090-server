name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: gofmt -w . && git diff --exit-code
      - run: CGO_ENABLED=0 go test ./...
      - run: CGO_ENABLED=0 go vet ./...
