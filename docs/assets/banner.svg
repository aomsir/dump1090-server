      <text x="72" y="-66" fill="#58A6FF" font-size="15" letter-spacing="1">FL340</text>
      <path d="M-132 105H-78" stroke="#3FB950" stroke-width="2"/>
      <text x="-132" y="130" fill="#6E7781" font-size="15" letter-spacing="1">52.31N 4.76E</text>
      <text x="70" y="119" fill="#2DD4BF" font-size="15" font-weight="700" letter-spacing="1">1090 MHz</text>
